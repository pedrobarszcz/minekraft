
name: ZIP to JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Convert ZIP to JAR
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          cp "$ZIP_FILE" converted.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: converted-jar
          path: converted.jar
